#Configurations H2
spring.jpa.show-sql=true
spring.h2.console.enabled=true
#defini l'encodage pour data.sql
spring.sql.init.encoding=UTF-8
#Spring Boot 2.5+ : executer data.sql APRES la creation des tables par Hibernate
spring.jpa.defer-datasource-initialization=true

#Eureka : indique l'URL d'Eureka a laquelle il faut s'enregistrer
eureka.client.serviceUrl.defaultZone=http://localhost:9102/eureka/

#Actuator
management.endpoints.web.exposure.include=*

#Les configurations personnalisees
mes-configs.limitDeProduits=3
